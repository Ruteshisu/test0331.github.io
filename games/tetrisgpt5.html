<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(to bottom, #222, #555);
    color: white;
    font-family: sans-serif;
    margin: 0;
  }
  canvas {
    border: 4px solid #fff;
    background: #000;
    margin: 10px;
  }
  #controls {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    width: 60px; height: 60px;
    margin: 5px;
    background: #444;
    color: white;
    font-size: 20px;
    border: none;
    border-radius: 10px;
  }
  .btn:active {
    background: #888;
  }
</style>
</head>
<body>
<h1>テトリス</h1>
<div style="display:flex; gap:20px;">
  <canvas id="game" width="300" height="600"></canvas>
  <div>
    <h3>Next</h3>
    <canvas id="next" width="120" height="120"></canvas>
  </div>
</div>
<div id="controls">
  <button class="btn" onclick="move(-1)">←</button>
  <button class="btn" onclick="drop()">↓</button>
  <button class="btn" onclick="move(1)">→</button>
  <button class="btn" onclick="rotate(-1)">⟲</button>
  <button class="btn" onclick="rotate(1)">⟳</button>
</div>

<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
context.scale(30,30);

const nextCanvas = document.getElementById('next');
const nextContext = nextCanvas.getContext('2d');
nextContext.scale(30,30);

const colors = [
  null,
  '#FF0D72', '#0DC2FF', '#0DFF72',
  '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
];

const SHAPES = [
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[4,4,0],[0,4,4]],
  [[0,5,5],[5,5,0]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]],
];

function createMatrix(w,h){
  const matrix=[];
  while(h--){
    matrix.push(new Array(w).fill(0));
  }
  return matrix;
}

function collide(arena,player){
  const m=player.matrix;
  const o=player.pos;
  for(let y=0;y<m.length;y++){
    for(let x=0;x<m[y].length;x++){
      if(m[y][x]!==0 &&
        (arena[y+o.y] &&
         arena[y+o.y][x+o.x])!==0){
        return true;
      }
    }
  }
  return false;
}

function merge(arena,player){
  player.matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value!==0){
        arena[y+player.pos.y][x+player.pos.x]=value;
      }
    });
  });
}

function rotateMatrix(matrix,dir){
  const result = matrix.map((_,i)=>matrix.map(row=>row[i]));
  if(dir>0){ return result.map(row=>row.reverse()); }
  else { return result.reverse(); }
}

function playerDrop(){
  player.pos.y++;
  if(collide(arena,player)){
    player.pos.y--;
    merge(arena,player);
    playerReset();
    arenaSweep();
  }
  dropCounter=0;
}

function playerMove(dir){
  player.pos.x+=dir;
  if(collide(arena,player)){
    player.pos.x-=dir;
  }
}

function playerReset(){
  player.matrix = nextPiece.matrix;
  nextPiece.matrix = createPiece();
  player.pos.y=0;
  player.pos.x=(arena[0].length/2|0)-(player.matrix[0].length/2|0);
  if(collide(arena,player)){
    arena.forEach(row=>row.fill(0));
  }
  drawNext();
}

function playerRotate(dir){
  const pos=player.pos.x;
  let offset=1;
  player.matrix = rotateMatrix(player.matrix,dir);
  while(collide(arena,player)){
    player.pos.x+=offset;
    offset=-(offset+(offset>0?1:-1));
    if(offset>player.matrix[0].length){
      player.matrix = rotateMatrix(player.matrix,-dir);
      player.pos.x=pos;
      return;
    }
  }
}

function arenaSweep(){
  outer: for(let y=arena.length-1;y>=0;y--){
    for(let x=0;x<arena[y].length;x++){
      if(arena[y][x]===0){
        continue outer;
      }
    }
    const row=arena.splice(y,1)[0].fill(0);
    arena.unshift(row);
    y++;
  }
}

function drawMatrix(matrix,offset,ctx= context){
  matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value!==0){
        ctx.fillStyle=colors[value];
        ctx.fillRect(x+offset.x,y+offset.y,1,1);
      }
    });
  });
}

function draw(){
  context.fillStyle='#000';
  context.fillRect(0,0,canvas.width,canvas.height);
  drawMatrix(arena,{x:0,y:0});
  drawMatrix(player.matrix,player.pos);
}

function drawNext(){
  nextContext.fillStyle='#222';
  nextContext.fillRect(0,0,nextCanvas.width,nextCanvas.height);
  drawMatrix(nextPiece.matrix,{x:1,y:1},nextContext);
}

function update(time=0){
  const deltaTime=time-lastTime;
  lastTime=time;
  dropCounter+=deltaTime;
  if(dropCounter>dropInterval){
    playerDrop();
  }
  draw();
  requestAnimationFrame(update);
}

function createPiece(){
  const type=SHAPES[Math.floor(Math.random()*SHAPES.length)];
  return type;
}

const arena=createMatrix(10,20);
const player={pos:{x:0,y:0},matrix:null};
const nextPiece={matrix:createPiece()};

let dropCounter=0;
let dropInterval=1000;
let lastTime=0;

function move(dir){playerMove(dir);}
function rotate(dir){playerRotate(dir);}
function drop(){playerDrop();}

document.addEventListener('keydown',event=>{
  if(event.key==='ArrowLeft'){playerMove(-1);}
  else if(event.key==='ArrowRight'){playerMove(1);}
  else if(event.key==='ArrowDown'){playerDrop();}
  else if(event.key==='q'){playerRotate(-1);}
  else if(event.key==='w'){playerRotate(1);}
});

playerReset();
update();
</script>
</body>
</html>
