<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シンプルテトリス</title>
  <style>
    canvas { background: #111; display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="tetris" width="240" height="400"></canvas>
  <script>
    const canvas = document.getElementById("tetris");
    const context = canvas.getContext("2d");
    context.scale(20, 20); // 1マスを20pxに拡大

    const ROW = 20;
    const COL = 12;

    // 空のフィールドを作成
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    // テトリミノ定義
    const SHAPES = {
      T: [[0,1,0],[1,1,1]],
      O: [[1,1],[1,1]],
      L: [[0,0,1],[1,1,1]],
      J: [[1,0,0],[1,1,1]],
      I: [[1,1,1,1]],
      S: [[0,1,1],[1,1,0]],
      Z: [[1,1,0],[0,1,1]]
    };
    const COLORS = [
      null,
      "#FF0D72", "#0DC2FF", "#0DFF72",
      "#F538FF", "#FF8E0D", "#FFE138", "#3877FF"
    ];

    // 回転処理
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    // 衝突判定
    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // フィールドにブロックを固定
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // 行消去
    function sweepArena() {
      outer: for (let y = arena.length - 1; y >= 0; y--) {
        for (let x = 0; x < arena[y].length; x++) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        y++;
      }
    }

    // 描画
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = "#111";
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    // プレイヤー操作
    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        sweepArena();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = "TJLOSZI";
      const type = pieces[Math.floor(Math.random() * pieces.length)];
      player.matrix = SHAPES[type].map(r => r.slice());
      player.color = Math.floor(Math.random() * (COLORS.length-1)) + 1;
      // 値をランダム色に差し替え
      player.matrix = player.matrix.map(row => row.map(v => v ? player.color : 0));
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // メインループ
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    // 初期化
    const arena = createMatrix(COL, ROW);
    const player = {
      pos: {x:0, y:0},
      matrix: null,
      color: 1,
    };

    playerReset();
    update();

    // キーボード操作
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") playerMove(-1);
      else if (e.key === "ArrowRight") playerMove(1);
      else if (e.key === "ArrowDown") playerDrop();
      else if (e.key === "q" || e.key === "Q") playerRotate(-1);
      else if (e.key === "w" || e.key === "W") playerRotate(1);
    });
  </script>
</body>
</html>
