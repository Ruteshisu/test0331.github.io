<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  body {
    background: linear-gradient(to bottom, #222, #555);
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  #game-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-top: 20px;
  }
  canvas {
    border: 2px solid white;
    background: #111;
    margin: 5px;
  }
  #touch-controls {
    margin-top: 10px;
  }
  .btn {
    font-size: 18px;
    margin: 5px;
    padding: 10px 20px;
    background: #444;
    color: white;
    border: none;
    border-radius: 5px;
  }
  .btn:active {
    background: #888;
  }
</style>
</head>
<body>
<h1>テトリス</h1>
<div id="game-container">
  <canvas id="game" width="200" height="400"></canvas>
  <canvas id="next" width="100" height="100"></canvas>
</div>

<div id="touch-controls">
  <button class="btn" id="left">←</button>
  <button class="btn" id="right">→</button>
  <button class="btn" id="down">↓</button>
  <button class="btn" id="rotateL">⟲</button>
  <button class="btn" id="rotateR">⟳</button>
</div>

<script>
const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 20;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

// テトリミノ定義
const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]],
};
const COLORS = {
  I: "cyan",
  O: "yellow",
  T: "purple",
  S: "lime",
  Z: "red",
  J: "blue",
  L: "orange",
};

let board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
let current, next;

function randomPiece() {
  const types = Object.keys(SHAPES);
  const type = types[Math.floor(Math.random()*types.length)];
  return {
    shape: SHAPES[type].map(r => [...r]),
    color: COLORS[type],
    x: Math.floor(COLS/2)-2,
    y: 0
  };
}

function drawBlock(x,y,color,context=ctx) {
  context.fillStyle = color;
  context.fillRect(x*BLOCK_SIZE, y*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
  context.strokeStyle = "#333";
  context.strokeRect(x*BLOCK_SIZE, y*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
}

function drawBoard() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(board[y][x]) drawBlock(x,y,board[y][x]);
    }
  }
}

function drawPiece(piece, context=ctx) {
  piece.shape.forEach((row,dy)=>{
    row.forEach((val,dx)=>{
      if(val){
        drawBlock(piece.x+dx, piece.y+dy, piece.color, context);
      }
    });
  });
}

function collide(p) {
  for(let y=0;y<p.shape.length;y++){
    for(let x=0;x<p.shape[y].length;x++){
      if(p.shape[y][x]){
        let nx = p.x+x, ny = p.y+y;
        if(nx<0 || nx>=COLS || ny>=ROWS || (ny>=0 && board[ny][nx])){
          return true;
        }
      }
    }
  }
  return false;
}

function merge(p){
  p.shape.forEach((row,dy)=>{
    row.forEach((val,dx)=>{
      if(val){
        board[p.y+dy][p.x+dx] = p.color;
      }
    });
  });
}

function clearLines(){
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(cell=>cell)){
      board.splice(y,1);
      board.unshift(Array(COLS).fill(null));
      y++;
    }
  }
}

function rotate(piece, dir){
  let rotated = piece.shape[0].map((_,i)=>
    piece.shape.map(row=>row[i])
  );
  if(dir>0){ // 右回転
    rotated = rotated.map(r=>r.reverse());
  } else {   // 左回転
    rotated.reverse();
  }
  const oldShape = piece.shape;
  piece.shape = rotated;
  if(collide(piece)){
    piece.shape = oldShape; // 戻す
  }
}

function drop(){
  current.y++;
  if(collide(current)){
    current.y--;
    merge(current);
    clearLines();
    current = next;
    next = randomPiece();
    if(collide(current)){
      alert("Game Over!");
      board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
    }
  }
}

function draw(){
  drawBoard();
  drawPiece(current);

  // ネクスト表示
  nextCtx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
  drawPiece({...next, x:1, y:1}, nextCtx);
}

function update(){
  drop();
  draw();
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft"){ current.x--; if(collide(current)) current.x++; }
  else if(e.key==="ArrowRight"){ current.x++; if(collide(current)) current.x--; }
  else if(e.key==="ArrowDown"){ drop(); }
  else if(e.key==="q"){ rotate(current,-1); }
  else if(e.key==="w"){ rotate(current,1); }
  draw();
});

// タッチ操作
document.getElementById("left").addEventListener("click",()=>{ current.x--; if(collide(current)) current.x++; draw(); });
document.getElementById("right").addEventListener("click",()=>{ current.x++; if(collide(current)) current.x--; draw(); });
document.getElementById("down").addEventListener("click",()=>{ drop(); draw(); });
document.getElementById("rotateL").addEventListener("click",()=>{ rotate(current,-1); draw(); });
document.getElementById("rotateR").addEventListener("click",()=>{ rotate(current,1); draw(); });

current = randomPiece();
next = randomPiece();
setInterval(update, 500);
</script>
</body>
</html>
