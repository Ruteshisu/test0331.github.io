<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>豪華版テトリス</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(180deg, #001f3f, #0074D9);
    font-family: sans-serif;
    color: white;
    height: 100vh;
  }
  #gameContainer {
    display: flex;
    margin-top: 20px;
  }
  canvas {
    border: 3px solid white;
    background: rgba(0,0,0,0.6);
  }
  #nextCanvas {
    margin-left: 15px;
    border: 2px solid #ccc;
    background: #111;
  }
  #controls {
    position: absolute;
    bottom: 10px;
    display: flex;
    justify-content: center;
    width: 100%;
    gap: 10px;
  }
  .btn {
    padding: 15px 20px;
    background: #444;
    border-radius: 8px;
    font-size: 18px;
    color: white;
    user-select: none;
    touch-action: manipulation;
  }
</style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="game" width="240" height="400"></canvas>
    <canvas id="nextCanvas" width="80" height="80"></canvas>
  </div>
  <div id="controls">
    <div class="btn" id="left">←</div>
    <div class="btn" id="rotate">⟳</div>
    <div class="btn" id="right">→</div>
    <div class="btn" id="down">↓</div>
  </div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");

const COLS = 10, ROWS = 20, BLOCK = 20;
const COLORS = [
  null,
  "#FF4136", "#2ECC40", "#0074D9", 
  "#FFDC00", "#B10DC9", "#FF851B", "#7FDBFF"
];

// ブロックの形
const SHAPES = [
  [],
  [[1,1,1,1]], // I
  [[1,1],[1,1]], // O
  [[0,1,0],[1,1,1]], // T
  [[0,1,1],[1,1,0]], // S
  [[1,1,0],[0,1,1]], // Z
  [[1,0,0],[1,1,1]], // J
  [[0,0,1],[1,1,1]]  // L
];

function createMatrix(w,h){
  const matrix=[];
  while(h--){
    matrix.push(new Array(w).fill(0));
  }
  return matrix;
}

function drawMatrix(matrix, offset, ctx){
  matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value!==0){
        ctx.fillStyle=COLORS[value];
        ctx.fillRect((x+offset.x)*BLOCK,(y+offset.y)*BLOCK,BLOCK,BLOCK);
        ctx.strokeStyle="#000";
        ctx.strokeRect((x+offset.x)*BLOCK,(y+offset.y)*BLOCK,BLOCK,BLOCK);
      }
    });
  });
}

function merge(arena,player){
  player.matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value!==0){
        arena[y+player.pos.y][x+player.pos.x]=value;
      }
    });
  });
}

function collide(arena,player){
  const m=player.matrix;
  const o=player.pos;
  for(let y=0;y<m.length;y++){
    for(let x=0;x<m[y].length;x++){
      if(m[y][x]!==0 &&
        (arena[y+o.y] && arena[y+o.y][x+o.x])!==0){
        return true;
      }
    }
  }
  return false;
}

function playerDrop(){
  player.pos.y++;
  if(collide(arena,player)){
    player.pos.y--;
    merge(arena,player);
    playerReset();
    arenaSweep();
  }
  dropCounter=0;
}

function playerMove(dir){
  player.pos.x+=dir;
  if(collide(arena,player)){
    player.pos.x-=dir;
  }
}

function rotate(matrix,dir){
  for(let y=0;y<matrix.length;y++){
    for(let x=0;x<y;x++){
      [matrix[x][y],matrix[y][x]]=
      [matrix[y][x],matrix[x][y]];
    }
  }
  if(dir>0) matrix.forEach(row=>row.reverse());
  else matrix.reverse();
}

function playerRotate(dir){
  const pos=player.pos.x;
  let offset=1;
  rotate(player.matrix,dir);
  while(collide(arena,player)){
    player.pos.x+=offset;
    offset=-(offset+(offset>0?1:-1));
    if(offset>player.matrix[0].length){
      rotate(player.matrix,-dir);
      player.pos.x=pos;
      return;
    }
  }
}

function playerReset(){
  player.matrix=player.next;
  player.next=SHAPES[(Math.random()*7|0)+1];
  player.pos.y=0;
  player.pos.x=(COLS/2|0)-(player.matrix[0].length/2|0);
  if(collide(arena,player)){
    arena.forEach(row=>row.fill(0));
  }
  drawNext();
}

function arenaSweep(){
  outer: for(let y=arena.length-1;y>=0;y--){
    for(let x=0;x<arena[y].length;x++){
      if(arena[y][x]===0){
        continue outer;
      }
    }
    const row=arena.splice(y,1)[0].fill(0);
    arena.unshift(row);
    y++;
  }
}

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawMatrix(arena,{x:0,y:0},ctx);
  drawMatrix(player.matrix,player.pos,ctx);
}

function drawNext(){
  nextCtx.fillStyle="#111";
  nextCtx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
  const offset={
    x:Math.floor((4-player.next[0].length)/2),
    y:Math.floor((4-player.next.length)/2)
  };
  drawMatrix(player.next,offset,nextCtx);
}

let dropCounter=0;
let dropInterval=1000;
let lastTime=0;

function update(time=0){
  const delta=time-lastTime;
  lastTime=time;
  dropCounter+=delta;
  if(dropCounter>dropInterval){
    playerDrop();
  }
  draw();
  requestAnimationFrame(update);
}

const arena=createMatrix(COLS,ROWS);
const player={
  pos:{x:0,y:0},
  matrix:null,
  next:SHAPES[(Math.random()*7|0)+1]
};
playerReset();
update();

// キー操作
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") playerMove(-1);
  else if(e.key==="ArrowRight") playerMove(1);
  else if(e.key==="ArrowDown") playerDrop();
  else if(e.key==="w"||e.key==="W") playerRotate(1);
  else if(e.key==="q"||e.key==="Q") playerRotate(-1);
});

// タップ操作
document.getElementById("left").onclick=()=>playerMove(-1);
document.getElementById("right").onclick=()=>playerMove(1);
document.getElementById("down").onclick=()=>playerDrop();
document.getElementById("rotate").onclick=()=>playerRotate(1);
</script>
</body>
</html>
